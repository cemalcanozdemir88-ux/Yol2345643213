<div class="middle-box text-center loginscreen">
  <div>
    <form class="m-t" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <input
          type="text"
          id="username"
          name="username"
          placeholder="E-Posta"
          class="form-control"
          [(ngModel)]="user.eposta"
          required
        />
      </div>
      <div class="form-group">
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Şifre"
          class="form-control"
          [(ngModel)]="user.sifre"
          required
        />
      </div>
      <button
        type="submit"
        [disabled]="isLoading"
        class="btn btn-primary block full-width m-b"
      >
        <i class="fa fa-spinner fa-spin fa-fw" *ngIf="isLoading"></i>Giriş Yap
      </button>
    </form>
  </div>
</div>
