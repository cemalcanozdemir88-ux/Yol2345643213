<div class="row wrapper border-bottom white-bg page-heading">
    <div class="col-sm-4">
      <h2>Affiliate</h2>
      <ol class="breadcrumb">
        <li class="breadcrumb-item">
          <a [routerLink]="['/']">Ana Sayfa</a>
        </li>
        <li class="breadcrumb-item active">
          <strong>Affiliate</strong>
        </li>
      </ol>
    </div>
  </div>
  
  <button
    style="display: none"
    data-toggle="modal"
    data-target="#affiliateEkleModal"
    #affiliateEkleModalButton
  >
    Open Affiliate Ekle Moda
  </button>
  
  <div class="wrapper wrapper-content">
    <div class="row">
      <div class="col-lg-12">
        <div class="ibox">
          <div class="ibox-title">
            <h5>Affiliate</h5>
            <div class="ibox-tools">
              <button
                *appHasAuthorization="Authorization.AffiliateEkleyebilir"
                class="btn btn-primary btn-xs"
                (click)="openAffiliateEkleModal()"
              >
                Yeni Affiliate Ekle
              </button>
            </div>
          </div>
          <div class="ibox-content">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>Sıra No</th>
                  <th>Unvan</th>
                  <th>Yatırım Komisyon Oranı</th>
                  <th>Çekim Komisyon Oranı</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let item of affiliates; let i = index">
                  <td>{{ i + 1 }}</td>
                  <td>{{ item.unvan }}</td>
                  <td>{{ item.yaririmKomisyonOrani }} %</td>
                  <td>{{ item.cekimKomisyonOrani }} %</td>
                  <td class="text-right footable-visible footable-last-column">
                    <div>
                      <button
                        *appHasAuthorization="
                          Authorization.AffiliateDuzenleyebilir
                        "
                        class="btn-primary btn btn-xs mr-2"
                        (click)="startEdit(item.id)"
                      >
                        Düzenle
                      </button>
                      <button
                        *appHasAuthorization="Authorization.AffiliateSilebilir"
                        class="btn-danger btn btn-xs"
                        data-toggle="modal"
                        data-target="#affiliateSilModal"
                        (click)="startDelete(item.id)"
                      >
                        Sil
                      </button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <div
    class="modal inmodal fade"
    id="affiliateSilModal"
    role="dialog"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-body">
          <h3>Kaydı silmek istediğinize emin misiniz?</h3>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-white"
            data-dismiss="modal"
            #affiliateSilModalKapatButton
            (click)="cancelDelete()"
          >
            Kapat
          </button>
          <button
            type="submit"
            class="btn btn-danger"
            [disabled]="isDeleting"
            (click)="deleteRecord()"
          >
            <i class="fa fa-spinner fa-spin fa-fw" *ngIf="isDeleting"></i>Sil
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <div
    class="modal inmodal fade"
    id="affiliateEkleModal"
    tabindex="-1"
    role="dialog"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <form
          (ngSubmit)="submitCreateAffiliateForm(affiliateForm)"
          #affiliateForm="ngForm"
        >
          <div class="modal-body">
            <div class="row">
              <div class="col-sm-12">
                <div class="form-group">
                  <label for="unvan">
                    Ünvan <span class="text-danger">*</span>
                  </label>
                  <input
                    type="text"
                    class="form-control"
                    id="unvan"
                    name="unvan"
                    required
                    [(ngModel)]="affiliateCreateModel.unvan"
                  />
                </div>
              </div>
              <div class="col-sm-6">
                <div class="form-group">
                  <label for="yaririmKomisyonOrani">
                    Yarıım Komisyon Oranı
                    <span class="text-danger">*</span>
                  </label>
                  <div class="input-group m-b">
                    <input type="number" class="form-control" id="yaririmKomisyonOrani" name="yaririmKomisyonOrani" [(ngModel)]="affiliateCreateModel.yaririmKomisyonOrani">
                    <div class="input-group-append">
                        <span class="input-group-addon">%</span>
                    </div>
                </div>
                </div>
              </div>
              <div class="col-sm-6">
                <div class="form-group">
                  <label for="cekimKomisyonOrani">
                    Çekim Komisyon Oranı
                    <span class="text-danger">*</span>
                  </label>
                  <div class="input-group m-b">
                    <input type="number" class="form-control" id="cekimKomisyonOrani" name="cekimKomisyonOrani" [(ngModel)]="affiliateCreateModel.cekimKomisyonOrani">
                    <div class="input-group-append">
                        <span class="input-group-addon">%</span>
                    </div>
                </div>

                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-white"
              #affiliateEkleModalKapatButton
              data-dismiss="modal"
              (click)="closeAffiliateEkleModalKapat()"
            >
              Kapat
            </button>
            <button type="submit" class="btn btn-primary" [disabled]="isCreating">
              <i class="fa fa-spinner fa-spin fa-fw" *ngIf="isCreating"></i>Kaydet
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
