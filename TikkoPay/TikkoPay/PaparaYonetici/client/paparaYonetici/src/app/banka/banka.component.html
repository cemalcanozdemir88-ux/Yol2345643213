<div class="row wrapper border-bottom white-bg page-heading">
  <div class="col-sm-4">
    <h2>Bankalar</h2>
    <ol class="breadcrumb">
      <li class="breadcrumb-item">
        <a [routerLink]="['/']">Ana Sayfa</a>
      </li>
      <li class="breadcrumb-item active">
        <strong>Bankalar</strong>
      </li>
    </ol>
  </div>
</div>

<button
  style="display: none"
  data-toggle="modal"
  data-target="#bankaEkleModal"
  #bankaEkleModalButton>
  Open Banka Ekle Moda
</button>

<div class="wrapper wrapper-content">
  <div class="row">
    <div class="col-lg-12">
      <div class="ibox">
        <div class="ibox-title">
          <h5>Bankalar</h5>
          <div class="ibox-tools">
            <button
              *appHasAuthorization="Authorization.BankaTanimlariEkleyebilir"
              class="btn btn-primary btn-xs"
              (click)="openBankaEkleModal()">
              Yeni Banka Ekle
            </button>
          </div>
        </div>
        <div class="ibox-content">

          <div class="table-responsive">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>Sıra No</th>
                  <th>Başlık</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let item of bankaList; let i = index">
                  <td>{{ i + 1 }}</td>
                  <td>{{ item.baslik }}</td>
                  <td class="text-right footable-visible footable-last-column">
                    <div>
                      <button
                        *appHasAuthorization="Authorization.BankaTanimlariDuzenleyebilir"
                        class="btn-primary btn btn-xs mr-2"
                        (click)="startEdit(item.id)">
                        Düzenle
                      </button>
                      <button
                        *appHasAuthorization="Authorization.BankaTanimlariSilebilir"
                        class="btn-danger btn btn-xs"
                        data-toggle="modal"
                        data-target="#bankaSilModal"
                        (click)="startDelete(item.id)">
                        Sil
                      </button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          
        </div>
      </div>
    </div>
  </div>
</div>

<div
  class="modal inmodal fade"
  id="bankaSilModal"
  role="dialog"
  aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-body">
        <h3>Kaydı silmek istediğinize emin misiniz?</h3>
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-white"
          data-dismiss="modal"
          #bankaSilModalKapatButton
          (click)="cancelDelete()">
          Kapat
        </button>
        <button
          type="submit"
          class="btn btn-danger"
          [disabled]="isDeleting"
          (click)="deleteRecord()">
          <i class="fa fa-spinner fa-spin fa-fw" *ngIf="isDeleting"></i>Sil
        </button>
      </div>
    </div>
  </div>
</div>

<div
  class="modal inmodal fade"
  id="bankaEkleModal"
  tabindex="-1"
  role="dialog"
  aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form (ngSubmit)="submitCreateBankaForm(bankaForm)" #bankaForm="ngForm">
        <div class="modal-body">
          <div class="row">
            <div class="col-md-12">
              <div class="form-group">
                <label for="baslik">
                  Başlık <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  class="form-control"
                  id="baslik"
                  name="baslik"
                  required
                  [(ngModel)]="bankaCreateModel.baslik"
                  required />
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-white"
            #bankaEkleModalKapatButton
            data-dismiss="modal"
            (click)="closeBankaEkleModalKapat()">
            Kapat
          </button>
          <button type="submit" class="btn btn-primary" [disabled]="isCreating">
            <i class="fa fa-spinner fa-spin fa-fw" *ngIf="isCreating"></i>Kaydet
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
