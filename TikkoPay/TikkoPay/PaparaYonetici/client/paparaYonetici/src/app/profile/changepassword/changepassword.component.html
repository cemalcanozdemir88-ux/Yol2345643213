<div class="row wrapper border-bottom white-bg page-heading">
    <div class="col-sm-4">
      <h2>Profil / Şifre Değiştir</h2>
      <ol class="breadcrumb">
        <li class="breadcrumb-item">
          <a [routerLink]="['/']">Ana Sayfa</a>
        </li>
        <li class="breadcrumb-item active">
          <strong>Profil / Şifre Değiştir</strong>
        </li>
      </ol>
    </div>
  </div>
  
  <div class="wrapper wrapper-content">

  
    <div class="row">
      <div class="col-lg-6">
        <div class="ibox">
          <div class="ibox-content">

            <form #kullaniciForm="ngForm" (ngSubmit)="submitChangePasswordForm(kullaniciForm)">
            <div class="modal-body">
              <div class="row">

                <div class="col-md-12">
                  <div class="form-group">
                    <label for="sifre">
                      Şifre <span class="text-danger">*</span>
                    </label>
                    <input
                      type="password"
                      class="form-control"
                      id="oldPassword"
                      name="oldPassword"
                      autocomplete="false"
                      required
                      [(ngModel)]="changePasswordModel.oldPassword"
                    />
                  </div>
                </div>

                <div class="col-md-12">
                    <div class="form-group">
                      <label for="sifre">
                        Yeni Şifre <span class="text-danger">*</span>
                      </label>
                      <input
                        type="password"
                        class="form-control"
                        id="newPassword"
                        name="newPassword"
                        autocomplete="false"
                        required
                        [(ngModel)]="changePasswordModel.newPassword"
                      />
                    </div>
                  </div>

                  <div class="col-md-12">
                    <div class="form-group">
                      <label for="sifre">
                        Yeni Şifre Tekrar <span class="text-danger">*</span>
                      </label>
                      <input
                        type="password"
                        class="form-control"
                        id="newPasswordConfirm"
                        name="newPasswordConfirm"
                        autocomplete="false"
                        required
                        [(ngModel)]="changePasswordModel.newPasswordConfirm"
                      />
                    </div>
                  </div>
    
              </div>
            </div>
            <div class="modal-footer">
              
              <button type="submit" class="btn btn-primary" [disabled]="isCreating">
                <i class="fa fa-spinner fa-spin fa-fw" *ngIf="isCreating"></i>Kaydet
              </button>
            </div>
          </form>

          </div>
        </div>
      </div>
    </div>
  
  </div>
